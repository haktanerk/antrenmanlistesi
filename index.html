<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Antrenman Takip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f8fc;
    --surface:#ffffff;
    --surface-2:#eaf1fc;
    --line:#dbe6f5;
    --text:#101828;
    --text-dim:#64748b;
    --accent:#2563eb;
    --accent-dim:#93c5fd;
    --warn:#e6543f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter', sans-serif;
    padding-bottom:40px;
  }
  header{
    position:sticky; top:0; z-index:10;
    background:var(--bg);
    padding:18px 16px 0 16px;
    border-bottom:1px solid var(--line);
  }
  h1{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700; font-size:26px; letter-spacing:0.5px;
    margin:0 0 2px 0; text-transform:uppercase;
  }
  .sub{ color:var(--text-dim); font-size:12.5px; margin-bottom:14px;}
  .tabs{ display:flex; gap:6px; margin-bottom:0;}
  .tab{
    flex:1; text-align:center; padding:10px 2px 12px 2px;
    font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:14.5px;
    color:var(--text-dim); border-bottom:3px solid transparent;
    cursor:pointer; letter-spacing:0.2px; text-transform:uppercase;
  }
  .tab.active{ color:var(--accent); border-bottom:3px solid var(--accent); }

  main{ padding:14px 14px 0 14px; max-width:520px; margin:0 auto; }
  .day-note{ color:var(--text-dim); font-size:12px; margin:12px 2px 14px 2px; line-height:1.5;}
  .block-label{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.6px;
    color:var(--accent-dim); text-transform:uppercase; margin:18px 2px 6px 2px;
  }
  .block-label.first{ margin-top:4px; }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:14px 14px 12px 14px; margin-bottom:10px;
    box-shadow:0 1px 3px rgba(16,24,40,0.06);
  }
  .card.superset{ border-left:3px solid var(--accent-dim); }
  .row-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .ex-name{ font-size:15.5px; font-weight:600; line-height:1.3; }
  .meta{ display:flex; gap:14px; margin-top:6px; }
  .meta-item{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--text-dim); }
  .meta-item b{ color:var(--text); font-weight:600; }
  .link-btn{
    font-size:11px; color:var(--accent); text-decoration:none;
    border:1px solid var(--accent-dim); border-radius:20px; padding:5px 10px;
    white-space:nowrap; font-family:'Inter'; font-weight:500;
  }

  .stepper{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:12px; background:var(--surface-2); border-radius:12px; padding:4px;
  }
  .stepper button{
    width:46px; height:44px; border:none; border-radius:9px;
    background:transparent; color:var(--text); font-size:22px; font-weight:600;
    cursor:pointer; user-select:none;
  }
  .stepper button:active{ background:var(--accent); color:#ffffff; }
  .stepper button.minus:active{ background:var(--warn); color:#ffffff; }
  .weight-display{
    flex:1; text-align:center; font-family:'IBM Plex Mono', monospace;
    font-size:19px; font-weight:600; letter-spacing:0.5px;
    transition:transform 0.12s ease;
  }
  .weight-display.bump{ transform:scale(1.12); color:var(--accent); }
  .weight-unit{ font-size:12px; color:var(--text-dim); margin-left:3px; font-weight:500;}

  .sets-row{
    display:flex; align-items:center; gap:8px; margin-top:8px;
  }
  .set-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    height:44px; border-radius:10px; border:1px solid var(--accent-dim);
    background:transparent; color:var(--text); font-family:'Inter'; font-weight:600;
    font-size:13.5px; cursor:pointer; user-select:none;
  }
  .set-btn .dots{ display:flex; gap:5px; }
  .set-dot{
    width:9px; height:9px; border-radius:50%; background:var(--surface-2);
    border:1px solid var(--line); transition:background 0.15s ease;
  }
  .set-dot.filled{ background:var(--accent); border-color:var(--accent); }
  .set-btn.complete{ border-color:var(--accent); color:var(--accent); }
  .set-reset{
    width:40px; height:44px; border-radius:10px; border:1px solid var(--line);
    background:transparent; color:var(--text-dim); font-size:15px; cursor:pointer;
  }

  .timer-row{
    display:flex; align-items:center; gap:8px; margin-top:8px;
    background:var(--surface-2); border-radius:12px; padding:6px 8px;
  }
  .timer-display{
    font-family:'IBM Plex Mono', monospace; font-size:19px; font-weight:600;
    width:64px; text-align:center; letter-spacing:0.5px;
  }
  .timer-display.running{ color:var(--accent); }
  .timer-display.done{ color:var(--warn); }
  .timer-btn{
    flex:1; height:38px; border:none; border-radius:9px;
    background:transparent; color:var(--text); font-family:'Inter'; font-weight:600;
    font-size:12.5px; cursor:pointer;
  }
  .timer-btn.start{ background:var(--accent); color:#ffffff; }
  .timer-btn.pause{ background:var(--surface); border:1px solid var(--line); }
  .timer-btn.reset{ width:38px; flex:none; color:var(--text-dim); }

  .save-btn{
    display:block; width:100%; margin-top:18px; padding:14px;
    background:var(--accent); color:#ffffff; border:none; border-radius:14px;
    font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:16px;
    letter-spacing:0.4px; text-transform:uppercase; cursor:pointer;
  }
  .save-toast{
    text-align:center; color:var(--accent); font-size:12.5px; font-weight:600;
    margin-top:8px; height:16px;
  }

  .hist-empty{ text-align:center; color:var(--text-dim); font-size:13px; margin-top:40px; padding:0 20px; }
  .hist-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(16,24,40,0.06);
  }
  .hist-head{ display:flex; justify-content:space-between; align-items:flex-start; }
  .hist-day{
    font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:15px;
    color:var(--accent); text-transform:uppercase;
  }
  .hist-datetime{ font-size:11.5px; color:var(--text-dim); font-family:'IBM Plex Mono', monospace; margin-top:2px; }
  .hist-del{
    border:none; background:transparent; color:var(--text-dim); font-size:13px; cursor:pointer;
    padding:4px 6px;
  }
  .hist-ex-row{
    display:flex; justify-content:space-between; align-items:center;
    font-size:13px; padding:7px 0; border-top:1px solid var(--line);
  }
  .hist-ex-name{ color:var(--text); }
  .hist-ex-stats{ font-family:'IBM Plex Mono', monospace; color:var(--text-dim); font-size:12.5px; white-space:nowrap; margin-left:10px; }

  .notes-section{
    margin-top:24px; padding:14px; background:var(--surface);
    border:1px solid var(--line); border-radius:14px;
  }
  .notes-section h2{
    font-family:'Barlow Condensed', sans-serif; font-size:17px; text-transform:uppercase;
    margin:0 0 10px 0; color:var(--accent);
  }
  .note-item{ margin-bottom:10px; }
  .note-item .t{ font-weight:600; font-size:13px; margin-bottom:2px; }
  .note-item .d{ font-size:12.5px; color:var(--text-dim); line-height:1.5; }

  footer{ text-align:center; color:var(--text-dim); font-size:11px; margin-top:26px; padding:0 20px; }
</style>
</head>
<body>

<header>
  <h1>Antrenman Programı</h1>
  <div class="sub">Haftada 3 gün · Ağırlıklar otomatik kaydedilir · 2.5 kg adım</div>
  <div class="tabs" id="tabs"></div>
</header>

<main id="main"></main>

<footer>Ağırlık değerleri sadece bu cihazda saklanır.</footer>

<script>
const DAYS = [
  {
    id: "gunA",
    title: "Gün A — Üst Vücut (İtiş)",
    note: "Isınma: 5 dk hafif kardiyo + 1-2 hafif set çalışılacak eklemler için.",
    exercises: [
      {blok:"İtiş - Ana", name:"Bench Press (barbell/dumbbell)", sr:"4x6-8", rest:"2-3 dk", start:20},
      {blok:"İtiş - Ana", name:"Overhead Press (dumbbell)", sr:"3x8-10", rest:"2 dk", start:10},
      {blok:"Çekiş", name:"Lat Pulldown veya Pull-up", sr:"3x8-10", rest:"2 dk", start:0},
      {blok:"İtiş - İkincil", name:"Incline Dumbbell Press", sr:"3x10-12", rest:"90 sn", start:12.5},
      {blok:"Omuz", name:"Lateral Raise", sr:"3x12-15", rest:"60 sn", start:5},
      {blok:"Kol", name:"Triceps Pushdown", sr:"2x10-12", rest:"60 sn", start:15},
    ]
  },
  {
    id: "gunB",
    title: "Gün B — Üst Vücut (Çekiş)",
    note: "Isınma: 5 dk hafif kardiyo + 1-2 hafif set çalışılacak eklemler için.",
    exercises: [
      {blok:"Çekiş - Ana", name:"Barbell Row veya T-Bar Row", sr:"4x8-10", rest:"2-3 dk", start:30},
      {blok:"Çekiş - İkincil", name:"Seated Cable Row", sr:"3x10-12", rest:"2 dk", start:25},
      {blok:"İtiş", name:"Chest Press (machine/dumbbell)", sr:"3x8-10", rest:"2 dk", start:15},
      {blok:"Omuz Sağlığı", name:"Face Pull", sr:"3x15", rest:"60 sn", start:10},
      {blok:"Kol", name:"Biceps Curl", sr:"3x10-12", rest:"60 sn", start:10},
      {blok:"Omuz", name:"Rear Delt Fly", sr:"2x12-15", rest:"60 sn", start:5},
    ]
  },
  {
    id: "gunC",
    title: "Gün C — Alt Vücut + Karın",
    note: "Süper setler işaretli: aralarda dinlenmeden geç, çift bitince belirtilen süre dinlen. Toplam ~60 dk.",
    exercises: [
      {blok:"Ana Hareket", name:"Back Squat", sr:"4x6-8", rest:"3 dk", start:40, superset:false},
      {blok:"Ana Hareket", name:"Romanian Deadlift", sr:"3x8-10", rest:"2-3 dk", start:40, superset:false},
      {blok:"Süper Set 1", name:"Leg Press", sr:"3x10-12", rest:"0 sn (süper set)", start:60, superset:true},
      {blok:"Süper Set 1", name:"Leg Curl", sr:"3x12-15", rest:"90 sn (çift sonra)", start:20, superset:true},
      {blok:"Süper Set 2", name:"Bulgarian Split Squat", sr:"2x10-12/bacak", rest:"0 sn (süper set)", start:10, superset:true},
      {blok:"Süper Set 2", name:"Standing Calf Raise", sr:"2x12-15", rest:"60-90 sn (çift sonra)", start:30, superset:true},
      {blok:"Süper Set 3 - Karın", name:"Weighted Cable Crunch", sr:"3x12-15", rest:"0 sn (süper set)", start:15, superset:true},
      {blok:"Süper Set 3 - Karın", name:"Hanging Leg Raise", sr:"2x10-15", rest:"60 sn (çift sonra)", start:0, superset:true},
      {blok:"Karın - Oblik", name:"Cable Woodchopper", sr:"2x12/taraf", rest:"60 sn", start:10, superset:false},
    ]
  }
];

const NOTES = [
  ["İlerleme (Progressive Overload)", "Set/tekrar aralığının üst sınırına ulaşınca ağırlığı bir sonraki antrenmanda artırıp tekrar alt sınırdan başlayın."],
  ["Efor Seviyesi", "Setleri 0-2 tekrar rezervinde (RIR) bitirin; her set mutlak failure olmak zorunda değil."],
  ["Deload", "4-6 haftada bir, hacmi %40-50 azaltan hafif bir hafta uygulayın."],
  ["Dinlenme Süreleri", "Bileşik/ağır hareketlerde 2-3 dk, izolasyon hareketlerinde 60-90 sn dinlenme önerilir."],
];

const TAB_LABELS = ["Gün A", "Gün B", "Gün C", "Geçmiş"];
let currentDay = 0; // 0-2 = gün, 3 = geçmiş

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  TAB_LABELS.forEach((label, i) => {
    const t = document.createElement('div');
    t.className = 'tab' + (i === currentDay ? ' active' : '');
    t.textContent = label;
    t.onclick = () => { currentDay = i; renderTabs(); renderView(); };
    tabsEl.appendChild(t);
  });
}

function renderView(){
  if(currentDay === 3){ renderHistory(); } else { renderDay(); }
}

const STEP = 2.5;

function fmt(w){
  return (Number.isInteger(w) ? w : w.toFixed(1));
}

function exLink(name){
  return "https://www.google.com/search?q=" + encodeURIComponent(name + " exercise form") + "&tbm=isch";
}

function parseSetsTotal(sr){
  const m = sr.match(/^(\d+)\s*x/i);
  return m ? parseInt(m[1], 10) : 3;
}

function parseRestSeconds(restText){
  const nums = [];
  const re = /(\d+(?:\.\d+)?)\s*(dk|sn)/gi;
  let match;
  while((match = re.exec(restText)) !== null){
    const val = parseFloat(match[1]);
    const unit = match[2].toLowerCase();
    nums.push(unit === 'dk' ? val * 60 : val);
  }
  if(nums.length === 0) return 90;
  const avg = nums.reduce((a,b)=>a+b,0) / nums.length;
  return Math.round(avg);
}

function fmtTime(totalSeconds){
  const s = Math.max(0, Math.round(totalSeconds));
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function getSetsDone(dayId, idx){
  try{
    const raw = localStorage.getItem(`s:${dayId}:${idx}`);
    if(raw !== null) return parseInt(raw, 10);
  }catch(e){}
  return 0;
}

function setSetsDone(dayId, idx, value){
  try{ localStorage.setItem(`s:${dayId}:${idx}`, String(value)); }catch(e){}
}

function getHistory(){
  try{
    const raw = localStorage.getItem('workout_history');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return [];
}

function saveHistoryEntry(entry){
  const hist = getHistory();
  hist.unshift(entry);
  try{ localStorage.setItem('workout_history', JSON.stringify(hist)); }catch(e){}
}

function deleteHistoryEntry(id){
  const hist = getHistory().filter(h => h.id !== id);
  try{ localStorage.setItem('workout_history', JSON.stringify(hist)); }catch(e){}
}

async function getWeight(dayId, idx, fallback){
  try{
    const raw = localStorage.getItem(`w:${dayId}:${idx}`);
    if(raw !== null) return parseFloat(raw);
  }catch(e){}
  return fallback;
}

async function setWeight(dayId, idx, value){
  try{
    localStorage.setItem(`w:${dayId}:${idx}`, String(value));
  }catch(e){ console.error("storage error", e); }
}

async function renderDay(){
  const day = DAYS[currentDay];
  const main = document.getElementById('main');
  main.innerHTML = `<div class="day-note">${day.note}</div>`;
  const dayState = [];

  let lastBlok = null;
  for(let idx=0; idx<day.exercises.length; idx++){
    const ex = day.exercises[idx];
    if(ex.blok !== lastBlok){
      const label = document.createElement('div');
      label.className = 'block-label' + (idx===0 ? ' first' : '');
      label.textContent = ex.blok;
      main.appendChild(label);
      lastBlok = ex.blok;
    }

    const card = document.createElement('div');
    card.className = 'card' + (ex.superset ? ' superset' : '');

    const weight = await getWeight(day.id, idx, ex.start);

    card.innerHTML = `
      <div class="row-top">
        <div class="ex-name">${ex.name}</div>
        <a class="link-btn" href="${exLink(ex.name)}" target="_blank" rel="noopener">Görsel</a>
      </div>
      <div class="meta">
        <div class="meta-item">Set: <b>${ex.sr}</b></div>
        <div class="meta-item">Dinlenme: <b>${ex.rest}</b></div>
      </div>
      <div class="stepper">
        <button class="minus" aria-label="2.5 kg azalt">−</button>
        <div class="weight-display"><span class="wnum">${fmt(weight)}</span><span class="weight-unit">kg</span></div>
        <button class="plus" aria-label="2.5 kg artır">+</button>
      </div>
      <div class="sets-row">
        <button class="set-btn">
          <span class="dots"></span>
          <span class="set-label"></span>
        </button>
        <button class="set-reset" aria-label="Setleri sıfırla">↺</button>
      </div>
      <div class="timer-row">
        <div class="timer-display">00:00</div>
        <button class="timer-btn start">Başlat</button>
        <button class="timer-btn reset" aria-label="Kronometreyi sıfırla">↺</button>
      </div>
    `;

    const wDisplay = card.querySelector('.weight-display');
    const wNum = card.querySelector('.wnum');
    const minusBtn = card.querySelector('.minus');
    const plusBtn = card.querySelector('.plus');

    let current = weight;

    const bump = () => {
      wDisplay.classList.add('bump');
      setTimeout(()=>wDisplay.classList.remove('bump'), 140);
    };

    minusBtn.onclick = async () => {
      current = Math.max(0, current - STEP);
      wNum.textContent = fmt(current);
      bump();
      await setWeight(day.id, idx, current);
    };
    plusBtn.onclick = async () => {
      current = current + STEP;
      wNum.textContent = fmt(current);
      bump();
      await setWeight(day.id, idx, current);
    };

    // --- Set sayacı ---
    const setsTotal = parseSetsTotal(ex.sr);
    let setsDone = getSetsDone(day.id, idx);
    if(setsDone > setsTotal) setsDone = setsTotal;

    const setBtn = card.querySelector('.set-btn');
    const dotsEl = card.querySelector('.dots');
    const setLabelEl = card.querySelector('.set-label');
    const setResetBtn = card.querySelector('.set-reset');

    function renderSets(){
      dotsEl.innerHTML = '';
      for(let i=0;i<setsTotal;i++){
        const d = document.createElement('span');
        d.className = 'set-dot' + (i < setsDone ? ' filled' : '');
        dotsEl.appendChild(d);
      }
      const complete = setsDone >= setsTotal;
      setLabelEl.textContent = complete ? 'Tamamlandı ✓' : `Set ${setsDone}/${setsTotal}`;
      setBtn.classList.toggle('complete', complete);
    }
    renderSets();

    setBtn.onclick = () => {
      setsDone = setsDone >= setsTotal ? 0 : setsDone + 1;
      setSetsDone(day.id, idx, setsDone);
      renderSets();
    };
    setResetBtn.onclick = () => {
      setsDone = 0;
      setSetsDone(day.id, idx, setsDone);
      renderSets();
    };

    dayState.push({
      name: ex.name,
      setsTotal,
      getSetsDone: () => setsDone,
      getWeight: () => current,
    });

    // --- Dinlenme kronometresi ---
    const restSeconds = parseRestSeconds(ex.rest);
    let timeLeft = restSeconds;
    let timerInterval = null;
    let running = false;

    const timerDisplay = card.querySelector('.timer-display');
    const timerStartBtn = card.querySelector('.timer-btn.start');
    const timerResetBtn = card.querySelector('.timer-btn.reset');

    function renderTimer(){
      timerDisplay.textContent = fmtTime(timeLeft);
      timerDisplay.classList.toggle('running', running);
      timerDisplay.classList.toggle('done', timeLeft <= 0);
    }
    timeLeft = restSeconds;
    renderTimer();

    function beep(){
      try{
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 880;
        g.gain.setValueAtTime(0.15, ctx.currentTime);
        o.start();
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        o.stop(ctx.currentTime + 0.4);
      }catch(e){}
      if(navigator.vibrate) navigator.vibrate([200,80,200]);
    }

    function tick(){
      timeLeft -= 1;
      if(timeLeft <= 0){
        timeLeft = 0;
        clearInterval(timerInterval);
        running = false;
        timerStartBtn.textContent = 'Başlat';
        timerStartBtn.classList.remove('pause');
        timerStartBtn.classList.add('start');
        beep();
      }
      renderTimer();
    }

    timerStartBtn.onclick = () => {
      if(!running){
        if(timeLeft <= 0) timeLeft = restSeconds;
        running = true;
        timerStartBtn.textContent = 'Durdur';
        timerStartBtn.classList.remove('start');
        timerStartBtn.classList.add('pause');
        timerInterval = setInterval(tick, 1000);
      } else {
        running = false;
        clearInterval(timerInterval);
        timerStartBtn.textContent = 'Devam';
        timerStartBtn.classList.remove('pause');
        timerStartBtn.classList.add('start');
      }
      renderTimer();
    };
    timerResetBtn.onclick = () => {
      running = false;
      clearInterval(timerInterval);
      timeLeft = restSeconds;
      timerStartBtn.textContent = 'Başlat';
      timerStartBtn.classList.remove('pause');
      timerStartBtn.classList.add('start');
      renderTimer();
    };

    main.appendChild(card);
  }

  const saveBtn = document.createElement('button');
  saveBtn.className = 'save-btn';
  saveBtn.textContent = 'Antrenmanı Kaydet';
  const toast = document.createElement('div');
  toast.className = 'save-toast';
  saveBtn.onclick = () => {
    const doneExercises = dayState
      .filter(s => s.getSetsDone() > 0)
      .map(s => ({ name: s.name, sets: s.getSetsDone(), setsTotal: s.setsTotal, weight: s.getWeight() }));

    if(doneExercises.length === 0){
      toast.textContent = 'Kaydedilecek set bulunamadı — önce set işaretleyin.';
      setTimeout(()=>{ toast.textContent=''; }, 2500);
      return;
    }

    const now = new Date();
    const entry = {
      id: `${day.id}-${now.getTime()}`,
      dayId: day.id,
      dayLabel: day.title,
      dateStr: now.toLocaleDateString('tr-TR'),
      timeStr: now.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}),
      timestamp: now.getTime(),
      exercises: doneExercises,
    };
    saveHistoryEntry(entry);

    // Bir sonraki antrenman için set sayaçlarını sıfırla
    day.exercises.forEach((ex, idx) => setSetsDone(day.id, idx, 0));

    toast.textContent = 'Antrenman kaydedildi ✓';
    setTimeout(()=>{ toast.textContent=''; renderDay(); }, 900);
  };
  main.appendChild(saveBtn);
  main.appendChild(toast);

  const notesSection = document.createElement('div');
  notesSection.className = 'notes-section';
  notesSection.innerHTML = `<h2>Notlar</h2>` + NOTES.map(([t,d]) =>
    `<div class="note-item"><div class="t">${t}</div><div class="d">${d}</div></div>`
  ).join('');
  main.appendChild(notesSection);
}

function renderHistory(){
  const main = document.getElementById('main');
  main.innerHTML = `<div class="day-note">Kaydedilen antrenmanlarınız burada listelenir — en yeni en üstte.</div>`;
  const hist = getHistory();

  if(hist.length === 0){
    const empty = document.createElement('div');
    empty.className = 'hist-empty';
    empty.textContent = 'Henüz kayıtlı antrenman yok. Bir günü tamamlayıp "Antrenmanı Kaydet" butonuna bastığınızda burada görünecek.';
    main.appendChild(empty);
    return;
  }

  hist.forEach(entry => {
    const card = document.createElement('div');
    card.className = 'hist-card';
    const shortDay = entry.dayLabel.split('—')[0].trim();
    card.innerHTML = `
      <div class="hist-head">
        <div>
          <div class="hist-day">${shortDay}</div>
          <div class="hist-datetime">${entry.dateStr} · ${entry.timeStr}</div>
        </div>
        <button class="hist-del" aria-label="Kaydı sil">Sil</button>
      </div>
      ${entry.exercises.map(ex => `
        <div class="hist-ex-row">
          <span class="hist-ex-name">${ex.name}</span>
          <span class="hist-ex-stats">${ex.sets}/${ex.setsTotal} set · ${fmt(ex.weight)} kg</span>
        </div>
      `).join('')}
    `;
    card.querySelector('.hist-del').onclick = () => {
      deleteHistoryEntry(entry.id);
      renderHistory();
    };
    main.appendChild(card);
  });
}

renderTabs();
renderView();
</script>
</body>
</html>
